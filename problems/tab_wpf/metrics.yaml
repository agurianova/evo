specs:
  fitness:
    description: PredictorGraph quality. Real mode uses the canonical tabular score; regression synthetic mode uses clipped query R2; sandbox mode uses clipped normalized query log-loss. Synthetic scores are averaged within generator family and then equally across families.
    decimals: 5
    is_primary: true
    higher_is_better: true
    lower_bound: -1.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: 0.01
  is_valid:
    description: Whether graph parsing, operator execution, and model evaluation succeeded.
    decimals: 0
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: 1.0
  cv_score_std:
    description: Score dispersion across independent units; CV folds in real mode and complete tasks in either frozen-bank mode.
    decimals: 5
    is_primary: false
    higher_is_better: false
    lower_bound: 0.0
    upper_bound: 2.0
    include_in_prompts: true
    significant_change: 0.01
  task_score_p10:
    description: Tenth percentile of per-task clipped scores in frozen-bank modes; in real mode this equals the reported fitness.
    decimals: 5
    is_primary: false
    higher_is_better: true
    lower_bound: -1.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: 0.01
  evaluated_task_count:
    description: Number of complete frozen-bank tasks evaluated; one for the single-dataset real protocol.
    decimals: 0
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 100.0
    include_in_prompts: false
    significant_change: 1.0
  valid_task_rate:
    description: Fraction of selected frozen-bank tasks completed with finite predictions and scores.
    decimals: 4
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: 0.01
  graph_node_count:
    description: Diagnostic count of operator nodes; not an optimization objective.
    decimals: 0
    is_primary: false
    higher_is_better: false
    lower_bound: 0.0
    upper_bound: 16.0
    include_in_prompts: false
    significant_change: 1.0
  graph_max_depth:
    description: Diagnostic longest dependency path through consumed inputs.
    decimals: 0
    is_primary: false
    higher_is_better: false
    lower_bound: 0.0
    upper_bound: 16.0
    include_in_prompts: false
    significant_change: 1.0
  generated_feature_count:
    description: Diagnostic count of readout channels exported by the graph.
    decimals: 0
    is_primary: false
    higher_is_better: false
    lower_bound: 0.0
    upper_bound: 4096.0
    include_in_prompts: false
    significant_change: 1.0
  local_lipschitz_p95:
    description: Tabular behavior descriptor for local prediction sensitivity.
    decimals: 4
    is_primary: false
    higher_is_better: false
    lower_bound: 0.0
    upper_bound: 4.0
    include_in_prompts: false
    significant_change: 0.01
  ood_delta_slope:
    description: Tabular behavior descriptor for response to covariate shift.
    decimals: 4
    is_primary: false
    higher_is_better: false
    lower_bound: 0.0
    upper_bound: 2.0
    include_in_prompts: false
    significant_change: 0.01
