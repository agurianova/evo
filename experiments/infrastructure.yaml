# Infrastructure: server inventory for GigaEvo experiments
#
# This file is the SINGLE SOURCE OF TRUTH for all server IPs, ports, models,
# and roles. All experiment launch scripts, watchdogs, CONTEXT.md files, and
# skills should reference this file rather than hardcoding IPs.
#
# Update this file when servers change. See verification commands at bottom.
#
# Last verified: 2026-07-24

# --- LiteLLM Proxy ---
# Single load-balanced proxy for all LLM access. Start with: bash tools/litellm.sh
# All shared_config.py and launch scripts should point to this proxy.

litellm_proxy:
  host: "10.232.39.158"
  port: 4000
  alias_chain: "Qwen/Qwen3-8B"
  alias_mutation: "Qwen3-235B-A22B-Thinking-2507"
  alias_instruct: "Qwen/Qwen3-235B-A22B-Instruct-2507"

# --- Chain Execution LLMs ---
# Used for running evolved chains (retrieval, reasoning steps).
# Qwen3-8B. Nine vLLM instances across two nodes.

chain_servers:
  model: "Qwen/Qwen3-8B"
  context_window: 32768
  thinking_mode: true
  endpoints:
    - host: "10.232.39.158"
      port: 8000
      label: "chain-0"
    - host: "10.232.92.52"
      port: 8000
      label: "chain-1"
    - host: "10.232.92.52"
      port: 8001
      label: "chain-2"
    - host: "10.232.92.52"
      port: 8002
      label: "chain-3"
    - host: "10.232.92.52"
      port: 8003
      label: "chain-4"
    - host: "10.232.92.52"
      port: 8004
      label: "chain-5"
    - host: "10.232.92.52"
      port: 8005
      label: "chain-6"
    - host: "10.232.92.52"
      port: 8006
      label: "chain-7"
    - host: "10.232.92.52"
      port: 8007
      label: "chain-8"

# --- Mutation / Insights LLMs ---
# Used for LLM-based code mutation and insights generation.
# Qwen3-235B Thinking on two nodes.

mutation_servers:
  model: "Qwen3-235B-A22B-Thinking-2507"
  port: 8777
  thinking_mode: true
  endpoints:
    - host: "10.232.26.168"
      label: "mutation-1"
      status: active
    - host: "10.232.41.46"
      label: "mutation-2"
      status: active

# --- Instruct LLM (dedicated alias) ---
# Qwen3-235B Instruct variant, served TP=8 on port 8777.
# Exposed under its own alias (alias_instruct) — kept separate from the
# Thinking mutation pool, which behaves differently (reasoning traces).
# Launched WITHOUT a reasoning parser: Instruct is non-thinking, so a
# deepseek_r1/think parser would route all output (incl. structured JSON)
# into the unread `reasoning` field and leave `content` null.

instruct_servers:
  model: "Qwen/Qwen3-235B-A22B-Instruct-2507"
  port: 8777
  context_window: 160000
  thinking_mode: false
  max_parallel: 24
  endpoints:
    - host: "10.232.27.128"
      label: "instruct-0"
      status: active
      served_model_name: "Qwen3-235B-A22B-Instruct-2507"
    - host: "10.232.95.59"
      label: "instruct-1"
      status: active
      served_model_name: "Qwen3-235B-A22B-Instruct-2507"
    - host: "10.232.97.166"
      label: "instruct-2"
      status: active
      served_model_name: "Qwen3-235B-A22B-Instruct-2507"

# --- Squid Proxy Bypass ---
# All internal IPs must be in NO_PROXY to avoid the system Squid proxy
# intercepting HTTP calls. shared_config.py handles this automatically;
# launch scripts must also export NO_PROXY.
# NOTE: With litellm proxy on localhost, only the litellm process needs
# direct access to backend IPs. Clients talk to localhost:4000.

no_proxy_hosts:
  - "10.232.39.158"
  - "10.232.92.52"
  - "10.232.26.168"
  - "10.232.41.46"
  - "10.232.27.128"
  - "10.232.95.59"
  - "10.232.97.166"
  - "localhost"
  - "127.0.0.1"

# --- Task-Specific Environment Variables ---
# Chain URL env vars per task (set in launch scripts).

task_env_vars:
  hotpotqa:
    chain_url_var: "HOTPOTQA_CHAIN_URL"
  hover:
    chain_url_var: "HOVER_CHAIN_URL"

