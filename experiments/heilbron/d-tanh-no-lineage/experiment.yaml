treatment_checks:
- name: redis_frontier_fitness_history_present
  type: redis_key_pattern
  pattern: '{prefix}:metrics:history:program_metrics:valid_frontier_fitness'
  severity: MAJOR
  rationale: Frontier fitness history must accumulate as the run progresses.
- name: log_drift_cap_init
  type: log_pattern_present
  pattern: \[ProgressBasedSyncHook\] Init.*drift_cap=100000
  severity: MAJOR
- name: log_pipeline_heilbron_smooth_v1
  type: log_pattern_present
  pattern: pipeline.*heilbron_smooth_v1
  severity: MAJOR
- name: log_asymmetric_role_emitted
  type: log_pattern_present
  pattern: \[AsymmetricPipeline\].*role=(constructor|improver)
  severity: MAJOR
- name: log_asymmetric_feedback_mode_emitted
  type: log_pattern_present
  pattern: \[AsymmetricPipeline\].*feedback=(composition|gradient_in_prompt)
  severity: MAJOR
- name: log_opponents_db_id_visible
  type: log_pattern_present
  pattern: opponents=\[db=[1-8]
  severity: MAJOR
- name: log_opponent_result_mode_emitted
  type: log_pattern_present
  pattern: \[AdversarialPipeline\] opponent_result_mode=(exec|cached)
  severity: MAJOR
- name: log_opponent_provider_active
  type: log_pattern_present
  pattern: \[ExecOpponentResultProvider\] produced \d+/\d+|\[CachedOpponentResultProvider\] hit=\d+
  severity: MAJOR
- name: log_opponent_sampling_mode_emitted
  type: log_pattern_present
  pattern: opponent_sampling_mode=(softmax|top_k)
  severity: MAJOR
- name: log_bucketed_refresh_present
  type: log_pattern_present
  pattern: Bucketed refresh
  severity: MAJOR
- name: log_drift_cap_not_exceeded
  type: log_pattern_absent
  pattern: drift_cap exceeded
  severity: MAJOR
- name: log_population_role_not_defaulted
  type: log_pattern_absent
  pattern: defaulting to .* population_role
  severity: MAJOR
- name: log_feedback_mode_set
  type: log_pattern_absent
  pattern: feedback_mode not set
  severity: MAJOR
- name: log_bucketed_mget_no_fallback
  type: log_pattern_absent
  pattern: bucketed mget failed.*falling back to fifo
  severity: MAJOR
- name: log_no_lineage_aggregator_error
  type: log_pattern_absent
  pattern: lineage_filter.aggregator required
  severity: CRITICAL
  rationale: 'Volkov M2 ordering invariant. With disable_lineage_on_improver=true, _resolve_lineage_filter must NEVER be invoked. If this error appears, the gate misordered and ValueError was raised at pipeline build.

    '
- name: A1_D_disable_lineage_activation
  run_ref: A1_D
  type: log_pattern_present
  pattern: \[AsymmetricPipeline\] disable_lineage_on_improver=true
  severity: CRITICAL
  rationale: 'Activation log emitted at the same point as the three remove_stage() calls. Presence proves the gate fired AND ordering invariant held.

    '
- name: A2_D_disable_lineage_activation
  run_ref: A2_D
  type: log_pattern_present
  pattern: \[AsymmetricPipeline\] disable_lineage_on_improver=true
  severity: CRITICAL
- name: C1_D_disable_lineage_activation
  run_ref: C1_D
  type: log_pattern_present
  pattern: \[AsymmetricPipeline\] disable_lineage_on_improver=true
  severity: CRITICAL
- name: C2_D_disable_lineage_activation
  run_ref: C2_D
  type: log_pattern_present
  pattern: \[AsymmetricPipeline\] disable_lineage_on_improver=true
  severity: CRITICAL
- name: A1_D_no_lineagestage_compute
  run_ref: A1_D
  type: log_pattern_absent
  pattern: \[LineageStage\] program=|\[LineageStage:SharedBenchmark\]
  severity: CRITICAL
  rationale: With all three lineage stages removed, no LineageStage compute() may fire on D.
- name: A2_D_no_lineagestage_compute
  run_ref: A2_D
  type: log_pattern_absent
  pattern: \[LineageStage\] program=|\[LineageStage:SharedBenchmark\]
  severity: CRITICAL
- name: C1_D_no_lineagestage_compute
  run_ref: C1_D
  type: log_pattern_absent
  pattern: \[LineageStage\] program=|\[LineageStage:SharedBenchmark\]
  severity: CRITICAL
- name: C2_D_no_lineagestage_compute
  run_ref: C2_D
  type: log_pattern_absent
  pattern: \[LineageStage\] program=|\[LineageStage:SharedBenchmark\]
  severity: CRITICAL
- name: A1_G_lineagestage_active
  run_ref: A1_G
  type: log_pattern_present
  pattern: \[LineageStage\] program=
  severity: CRITICAL
  rationale: G keeps LineageStage; absence would invalidate the asymmetry control.
- name: A2_G_lineagestage_active
  run_ref: A2_G
  type: log_pattern_present
  pattern: \[LineageStage\] program=
  severity: CRITICAL
- name: C1_G_lineagestage_active
  run_ref: C1_G
  type: log_pattern_present
  pattern: \[LineageStage\] program=
  severity: CRITICAL
- name: C2_G_lineagestage_active
  run_ref: C2_G
  type: log_pattern_present
  pattern: \[LineageStage\] program=
  severity: CRITICAL
control_plane:
  watchdog:
    plugin: adversarial
    sentinel_value: -1.0
    plot_metrics:
    - actual_fitness
    plot_commands:
    - command: arms-race
      args:
        metric: actual_fitness
        paired: A1_G:A1_D,A2_G:A2_D,C1_G:C1_D,C2_G:C2_D
      output_name: arms_race.png
      caption: Arms-race dynamics (G vs D per pair)
    - command: comparison
      args:
        metric: actual_fitness
        smoothing: ema
        window: 10
        annotate-frontier: true
        no-frontier-for: A1_D,A2_D,C1_D,C2_D
        max-annotations: 3
      output_name: evolution_runs_comparison.png
      caption: G runs vs v2 baseline (0.03315); D runs excluded from frontier
    alert_thresholds:
      invalidity_rate: 0.75
      stagnation_window: 10
      generation_gap_threshold: 5
      excluded_events:
      - HOF_FETCH
      - HOF_ROTATE
      - CELL_PICK
      - TRACKER_WRITE
    poll_interval_s: 3600
    plot_retries: 3
    plot_retry_delay_s: 30
    rolling_comment_threshold_hours: 24
    checkpoint_milestones:
    - 0.1
    - 0.2
    - 0.5
    - 1.0
    no_proxy_hosts: []
  notifications:
    pr:
      enabled: true
      comment_mode: rolling
    telegram:
      enabled: true
      chat_id_env: TELEGRAM_CHAT_ID
      token_env: TELEGRAM_BOT_TOKEN
  watchdog_pid: 3999615
  anomaly_detector_cron_id: d73d9ba1
  checkpoint_cron_id: 09c0b609
