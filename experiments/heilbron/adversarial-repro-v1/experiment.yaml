treatment_checks:
  redis_key_pattern:
  - '{prefix}:metrics:history:program_metrics:valid_frontier_fitness'
  log_pattern_present:
  - '\[ProgressBasedSyncHook\] Init.*drift_cap=100000'
  - pipeline.*heilbron_repro_v1
  - '\[AsymmetricPipeline\].*role=(constructor|improver)'
  - '\[AsymmetricPipeline\].*feedback=(composition|gradient_in_prompt)'
  - 'opponents=\[db=[1-8]'
  # Opponent result provider telemetry (one of these must appear per run):
  #   Exec  : emitted by G runs (D opponents re-executed in subprocess)
  #   Cached: emitted by D runs (G opponents read from Redis, no exec)
  - '\[AdversarialPipeline\] opponent_result_mode=(exec|cached)'
  - '(\[ExecOpponentResultProvider\] produced \d+/\d+|\[CachedOpponentResultProvider\] hit=\d+)'
  log_pattern_absent:
  - drift_cap exceeded
  - defaulting to .* population_role
  - feedback_mode not set
  fitness_uniformity:
    max_identical_fraction: 0.95
control_plane:
  watchdog:
    plugin: adversarial
    sentinel_value: -1.0
    plot_metrics:
    - actual_fitness
    plot_commands:
    - command: arms-race
      args:
        metric: actual_fitness
        paired: A1_G:A1_D,A2_G:A2_D,C1_G:C1_D,C2_G:C2_D
      output_name: arms_race.png
      caption: Arms-race dynamics (G vs D per pair)
    - command: comparison
      args:
        metric: actual_fitness
        smoothing: ema
        window: 10
        annotate-frontier: true
        no-frontier-for: A1_D,A2_D,C1_D,C2_D
        max-annotations: 3
      output_name: evolution_runs_comparison.png
      caption: G runs vs v1 SOTA (0.0365); D runs excluded from frontier
    alert_thresholds:
      invalidity_rate: 0.75
      stagnation_window: 10
      generation_gap_threshold: 5
      # Pipeline uses simple RedisOpponentArchiveProvider (not CellStratified),
      # so HOF_FETCH/HOF_ROTATE/CELL_PICK are never emitted. Suppress to stop
      # the event_rate_zero alert from firing on these instrumentation-only
      # events.
      # TRACKER_WRITE is only emitted by the constructor-side pipeline
      # (DGTrackerStage runs on G runs, not D). The event_rate_zero alert
      # fires continuously on every D run because their TRACKER_WRITE count
      # is structurally 0. Suppress globally — we trade away the G-side
      # "tracker went silent" signal for no spam on D.
      excluded_events:
      - HOF_FETCH
      - HOF_ROTATE
      - CELL_PICK
      - TRACKER_WRITE
    poll_interval_s: 3600
    plot_retries: 3
    plot_retry_delay_s: 30
    rolling_comment_threshold_hours: 24
    checkpoint_milestones:
    - 0.1
    - 0.2
    - 0.5
    - 1.0
    no_proxy_hosts: []
  notifications:
    pr:
      enabled: true
      comment_mode: rolling
    telegram:
      enabled: true
      chat_id_env: TELEGRAM_CHAT_ID
      token_env: TELEGRAM_BOT_TOKEN
  watchdog_pid: 2041048
  anomaly_detector_cron_id: null
  checkpoint_cron_id: null
