control_plane:
  watchdog:
    plugin: adversarial
    sentinel_value: -1.0
    plot_metrics:
    - actual_fitness
    plot_commands:
    - command: arms-race
      args:
        metric: actual_fitness
        smoothing: ema
        window: 10
        bands: true
        show-max: true
        annotate-frontier: true
        max-annotations: 3
      output_name: arms_race.png
      caption: Arms-race dynamics (G vs D per cell A3/A5/B3/B5, max(G,D) overlay)
    - command: comparison
      args:
        metric: actual_fitness
        smoothing: ema
        window: 10
        annotate-frontier: true
        max-annotations: 3
      output_name: evolution_runs_comparison.png
      caption: All 8 runs vs SOTA baseline (2x2 factorial feedback_mode x K budget)
    alert_thresholds:
      invalidity_rate: 0.75
      stagnation_window: 10
      generation_gap_threshold: 5
    poll_interval_s: 3600
    plot_retries: 3
    plot_retry_delay_s: 30
    rolling_comment_threshold_hours: 24
