treatment_checks:
  redis_key_pattern:
  - '{prefix}:metrics:history:program_metrics:valid_frontier_fitness'
  log_pattern_present:
  - \[ProgressBasedSyncHook\] Init.*drift_cap=100000
  - pipeline.*heilbron_repro_v1
  - \[AsymmetricPipeline\].*role=(constructor|improver)
  - \[AsymmetricPipeline\].*feedback=(composition|gradient_in_prompt)
  - opponents=\[db=[1-8]
  - \[AdversarialPipeline\] opponent_result_mode=(exec|cached)
  - (\[ExecOpponentResultProvider\] produced \d+/\d+|\[CachedOpponentResultProvider\] hit=\d+)
  - opponent_sampling_mode=(softmax|top_k)
  - \[LineageStage:SharedBenchmark\] kept
  - Bucketed refresh
  - Multi-pass refresh done.*2 passes
  log_pattern_absent:
  - drift_cap exceeded
  - defaulting to .* population_role
  - feedback_mode not set
  - bucketed mget failed.*falling back to fifo
  fitness_uniformity:
    max_identical_fraction: 0.50
  # --- D-side tanh treatment verification checks ---
  # These checks verify that the tanh scoring formula (not the hard-floor) is
  # active at runtime. Checks apply to D runs only (A1_D, A2_D, C1_D, C2_D).
  d_treatment_checks:
  - name: d_fitness_no_point_mass_at_zero
    description: >
      After gen 3, fewer than 5% of D-archive programs may have fitness < 0.001.
      Under tanh scoring, raw_delta=0 maps to score=0.5, so the point mass at
      0.0 vanishes by construction. A failure here means the treatment code is
      not active (stale pyc, wrong problem_name, or shadowed evaluate.py).
    applies_to_runs: [A1_D, A2_D, C1_D, C2_D]
    type: fitness_uniformity
    after_gen: 3
    check: fraction_below_threshold
    threshold: 0.001
    max_fraction: 0.05
    severity: CRITICAL
    rationale: >
      evaluate.py:100 — tanh formula makes score=0.0 structurally impossible for
      valid opponents (only _invalid_opp_metrics() with is_valid=0.0 produces
      score=0.0, and those are gated out by the ConfigurableAggregator validity
      filter). Fraction > 5% at fitness < 0.001 proves the old hard-floor code
      is running instead of the tanh code. The stale pyc at
      problems/heilbron_repro_v1/pop_b/__pycache__/evaluate.cpython-312.pyc
      is a concrete risk: Python auto-recompiles when source mtime > pyc mtime,
      but if any launch path bypasses normal import (e.g. exec() or importlib
      with source_hash check disabled), the stale pyc would silently serve
      hard-floor scoring.
  - name: d_fitness_median_in_neutral_band
    description: >
      After gen 3, median D-archive fitness must fall in [0.3, 0.7]. Under tanh,
      programs with raw_delta near zero score near 0.5 (neutral). A median
      outside [0.3, 0.7] at gen 3 (before selection pressure has time to move
      the distribution) indicates either: (a) the hard-floor formula is running
      (median would collapse toward 0.0), or (b) an unexpected interaction is
      skewing all scores toward 1.0.
    applies_to_runs: [A1_D, A2_D, C1_D, C2_D]
    type: fitness_uniformity
    after_gen: 3
    check: median_in_range
    low: 0.3
    high: 0.7
    severity: CRITICAL
    rationale: >
      evaluate.py:100 — tanh(0/Q_MAX)=0 so score=0.5 for delta=0 opponents.
      Early-generation D programs mostly achieve near-zero delta; the distribution
      should be centered near 0.5. If the hard-floor formula were active, these
      same programs would score 0.0 and the median would be near 0.0.
  - name: d_fitness_has_submedian_scores
    description: >
      After gen 3, at least one D run must have programs with fitness strictly
      in (0.0, 0.5). This range is impossible under hard-floor scoring
      (which maps any worsening to score=0.0, not a value in (0, 0.5)).
      Under tanh, raw_delta < 0 produces score in (0, 0.5).
    applies_to_runs: [A1_D, A2_D, C1_D, C2_D]
    type: fitness_uniformity
    after_gen: 3
    check: fraction_in_range
    low: 0.0
    high: 0.5
    exclusive_bounds: true
    min_fraction: 0.01
    severity: CRITICAL
    rationale: >
      This is the smoking gun for treatment activity. evaluate.py:100 —
      tanh(negative/Q_MAX) maps worsening to (0, 0.5). The hard-floor formula
      evaluate.py (pre-treatment): delta=max(raw,0), so worsening always gave
      score=0.0 exactly. A non-zero fraction in (0, 0.5) is ONLY possible under
      the tanh formula. If this fraction is zero across all 4 D runs, the tanh
      treatment is not active.
  - name: stale_pyc_warning
    description: >
      Pre-launch manual check (not automated): delete or verify the stale pyc at
      problems/heilbron_repro_v1/pop_b/__pycache__/evaluate.cpython-312.pyc
      before launch. The pyc does not contain 'tanh' (confirmed by bytecode
      inspection). Python normally recompiles when source mtime > pyc mtime
      (which is currently the case), but this should be verified at launch time
      with: python3 -c "import importlib.util; spec =
      importlib.util.spec_from_file_location('evaluate',
      'problems/heilbron_repro_v1/pop_b/evaluate.py'); mod =
      importlib.util.module_from_spec(spec); spec.loader.exec_module(mod);
      import numpy as np; print(mod.evaluate.__module__)"
    applies_to_runs: [A1_D, A2_D, C1_D, C2_D]
    type: manual_pre_launch
    severity: MAJOR
    rationale: >
      Bytecode inspection confirmed the cached pyc lacks tanh and contains max
      (the hard-floor builtin). While Python's standard import recompiles when
      source mtime > pyc mtime (currently true), the pyc should be deleted before
      launch to eliminate any runtime ambiguity: rm
      problems/heilbron_repro_v1/pop_b/__pycache__/evaluate.cpython-312.pyc
control_plane:
  watchdog:
    plugin: adversarial
    sentinel_value: -1.0
    plot_metrics:
    - actual_fitness
    plot_commands:
    - command: arms-race
      args:
        metric: actual_fitness
        paired: A1_G:A1_D,A2_G:A2_D,C1_G:C1_D,C2_G:C2_D
      output_name: arms_race.png
      caption: Arms-race dynamics (G vs D per pair)
    - command: comparison
      args:
        metric: actual_fitness
        smoothing: ema
        window: 10
        annotate-frontier: true
        no-frontier-for: A1_D,A2_D,C1_D,C2_D
        max-annotations: 3
      output_name: evolution_runs_comparison.png
      caption: G runs vs v2 baseline (0.03315); D runs excluded from frontier
    alert_thresholds:
      invalidity_rate: 0.75
      stagnation_window: 10
      generation_gap_threshold: 5
      excluded_events:
      - HOF_FETCH
      - HOF_ROTATE
      - CELL_PICK
      - TRACKER_WRITE
    poll_interval_s: 3600
    plot_retries: 3
    plot_retry_delay_s: 30
    rolling_comment_threshold_hours: 24
    checkpoint_milestones:
    - 0.1
    - 0.2
    - 0.5
    - 1.0
    no_proxy_hosts: []
  notifications:
